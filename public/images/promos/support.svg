<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1A2E"/>
      <stop offset="1" stop-color="#1E3F66"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="330" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00B3DC" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00B3DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="470" y1="130" x2="730" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="1" stop-color="#BFD0E2"/>
    </linearGradient>
    <linearGradient id="screen" x1="490" y1="170" x2="710" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16314F"/>
      <stop offset="1" stop-color="#0E2238"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.05">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M150 0V675M300 0V675M450 0V675M600 0V675M750 0V675M900 0V675M1050 0V675"/>
  </g>
  <circle cx="600" cy="330" r="400" fill="url(#glow)"/>

  <!-- signal rings -->
  <g stroke="#00B3DC" fill="none" stroke-width="3">
    <circle cx="600" cy="345" r="250" stroke-opacity="0.18"/>
    <circle cx="600" cy="345" r="310" stroke-opacity="0.1"/>
  </g>

  <!-- smartphone -->
  <rect x="480" y="120" width="240" height="450" rx="36" fill="url(#phone)"/>
  <rect x="496" y="150" width="208" height="390" rx="22" fill="url(#screen)"/>
  <rect x="566" y="132" width="68" height="8" rx="4" fill="#9FB4CB"/>

  <!-- chat bubbles on screen -->
  <rect x="512" y="180" width="140" height="44" rx="14" fill="#2C4362"/>
  <rect x="528" y="196" width="90" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="548" y="240" width="140" height="58" rx="14" fill="#00B3DC"/>
  <rect x="564" y="256" width="100" height="10" rx="5" fill="#FFFFFF"/>
  <rect x="564" y="274" width="70" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="512" y="314" width="120" height="44" rx="14" fill="#2C4362"/>
  <circle cx="540" cy="336" r="5" fill="#7FE3FF"/>
  <circle cx="558" cy="336" r="5" fill="#7FE3FF" fill-opacity="0.7"/>
  <circle cx="576" cy="336" r="5" fill="#7FE3FF" fill-opacity="0.4"/>

  <!-- call button -->
  <circle cx="600" cy="460" r="42" fill="#2BD47D"/>
  <path d="M583 447c0-3 2.5-5 5-5h5l4 10-5 3.5a26 26 0 0 0 12.5 12.5l3.5-5 10 4v5c0 2.5-2 5-5 5-17 0-30-13-30-30z" fill="#FFFFFF"/>

  <ellipse cx="600" cy="595" rx="150" ry="12" fill="#000" fill-opacity="0.35"/>

  <!-- headset bubble -->
  <g transform="translate(860 170)">
    <rect x="0" y="0" width="170" height="130" rx="28" fill="#FFDC00"/>
    <path d="M40 130l-10 34 40-34z" fill="#FFDC00"/>
    <path d="M45 78v-14a40 40 0 0 1 80 0v14" stroke="#233955" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="34" y="70" width="24" height="36" rx="10" fill="#233955"/>
    <rect x="112" y="70" width="24" height="36" rx="10" fill="#233955"/>
    <path d="M124 106c0 10-12 14-30 14" stroke="#233955" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 24/7-ish clock bubble -->
  <g transform="translate(170 360)">
    <rect x="0" y="0" width="170" height="120" rx="28" fill="#FFFFFF" fill-opacity="0.1" stroke="#7FE3FF" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="85" cy="60" r="34" stroke="#7FE3FF" stroke-width="6" fill="none"/>
    <path d="M85 40v22l14 10" stroke="#7FE3FF" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- check bubble -->
  <g transform="translate(200 150)">
    <circle cx="50" cy="50" r="50" fill="#00B3DC" fill-opacity="0.25" stroke="#00B3DC" stroke-width="2"/>
    <path d="M28 52l15 15 30-32" stroke="#7FE3FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- payment card -->
  <g transform="translate(880 400) rotate(-8)">
    <rect x="0" y="0" width="190" height="120" rx="18" fill="#2C4362" stroke="#7FE3FF" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="0" y="26" width="190" height="22" fill="#0E2238"/>
    <rect x="20" y="70" width="34" height="26" rx="5" fill="#FFDC00"/>
    <rect x="70" y="76" width="90" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
</svg>
